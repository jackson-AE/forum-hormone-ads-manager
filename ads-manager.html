<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forum Health - Hormone Ads Manager</title>
<link rel="icon" type="image/png" sizes="128x128" href="agency-engineer-icon.png">
<style>
  :root{
    --brand:#3b82f6;--brand-2:#2563eb;--brand-3:#8b5cf6;--page:#07090f;--surface:#10131a;--surface-2:#171b25;
    --ink:#f5f2fb;--ink-2:#c8c0d8;--muted:#8b8498;--border:rgba(255,255,255,.12);
    --border-2:rgba(255,255,255,.07);--good:#31d47b;--bad:#ff5a72;--fb:#4b91ff;
    --google:#d946ef;--bing:#22d3ee;--sel:rgba(168,85,247,.18);
    --shadow:0 1px 2px rgba(0,0,0,.7),0 14px 36px rgba(21,9,37,.42);--r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:
    radial-gradient(900px 420px at 18% -12%,rgba(59,130,246,.12),transparent 62%),
    radial-gradient(760px 360px at 90% 6%,rgba(139,92,246,.08),transparent 64%),
    var(--page);color:var(--ink);
    line-height:1.4;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}
  button{color:inherit}
  .hidden{display:none!important}
  .hero{background:#0b1220;color:#fff;box-shadow:var(--shadow);
    border-bottom:1px solid rgba(255,255,255,.10)}
  .hero-inner{max-width:1480px;margin:auto;padding:17px 22px;display:flex;align-items:center;
    justify-content:space-between;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .offer-switch{position:relative}
  .logo{width:42px;height:42px;border:1px solid rgba(255,255,255,.28);border-radius:10px;
    display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,255,255,.07);color:#fff;
    cursor:pointer;padding:0}
  .logo:hover{background:rgba(168,85,247,.16);border-color:rgba(255,255,255,.42)}
  .offer-menu{position:absolute;left:0;top:50px;z-index:40;width:210px;padding:7px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
  .offer-option{width:100%;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;
    cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .offer-option:hover{background:var(--surface-2)}
  .offer-option[aria-selected="true"]{background:rgba(59,130,246,.16);color:#fff}
  .offer-option strong{display:block;font-size:13px;line-height:1.1}
  .offer-option span{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:650}
  .offer-check{color:var(--brand);font-size:13px;font-weight:900}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.1px}
  .offer-title{display:inline-flex;vertical-align:middle;margin-left:8px;border:1px solid rgba(255,255,255,.18);
    border-radius:999px;padding:2px 8px;color:#c8d9ff;background:rgba(59,130,246,.10);font-size:11px;font-weight:750}
  .header-actions{display:flex;align-items:center;gap:8px}
  .mode{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:650}
  .mode-dot{width:8px;height:8px;border-radius:50%;background:#eab308}
  .mode.live .mode-dot{background:#a855f7}
  .mode.refreshing .mode-dot{background:#d946ef;animation:pulse 1s ease-in-out infinite}
  .icon-btn{width:32px;height:30px;border:1px solid rgba(255,255,255,.20);border-radius:8px;
    background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer}
  .icon-btn:hover{background:rgba(168,85,247,.16)}
  .icon-btn svg{width:15px;height:15px}
  .icon-btn.spin svg{animation:spin .55s linear}
  .signout{border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.08);color:#fff;
    border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.45;transform:scale(.85)}}

  body.auth-locked .workspace{display:none}
  .login-gate{max-width:420px;margin:48px auto;padding:0 20px}
  .login-card{background:linear-gradient(180deg,rgba(23,18,34,.98),rgba(13,9,22,.98));border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--shadow);padding:24px}
  .login-card h2{margin:0 0 6px;font-size:20px}
  .login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .login-card label{display:block;margin-bottom:7px;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .login-card input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;
    background:var(--surface-2);color:var(--ink)}
  .login-card button{width:100%;margin-top:12px;border:0;border-radius:9px;padding:10px 13px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:750;cursor:pointer;
    box-shadow:0 12px 28px rgba(124,58,237,.28)}
  .login-error{min-height:18px;margin-top:9px;color:var(--bad);font-size:12px}

  .workspace{max-width:1480px;margin:0 auto;padding:18px 22px 52px}
  .filters{display:flex;align-items:flex-end;gap:18px 22px;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:10px;font-weight:750;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .field select,.field input{height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);
    color:var(--ink);padding:0 11px;font-size:13px;font-weight:600}
  .field select{min-width:238px}
  .field.search{width:260px}
  .field.search input{width:100%}
  .filter-spacer{flex:1}
  .dp-trigger{min-width:236px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);
    color:var(--ink);padding:0 12px;display:flex;align-items:center;gap:9px;font:inherit;font-size:13px;
    font-weight:650;cursor:pointer;white-space:nowrap}
  .dp-trigger:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(168,85,247,.14)}
  .dp-trigger .dp-icon{width:16px;height:16px;color:var(--muted)}
  .dp-trigger .dp-caret{margin-left:auto;width:12px;height:12px;color:var(--muted)}
  .dp-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:none;
    align-items:flex-start;justify-content:center;padding:16px}
  .dp-overlay.open{display:flex}
  .dp-panel{margin-top:max(0px,calc((100vh - 585px)/2));background:var(--surface);border:1px solid var(--border);
    border-radius:16px;box-shadow:0 16px 56px rgba(0,0,0,.22);display:flex;flex-direction:column;
    max-width:950px;width:100%;max-height:calc(100vh - 32px);overflow:hidden}
  .dp-body{display:flex;min-height:340px;overflow:auto}
  .dp-presets{width:218px;flex:0 0 218px;border-right:1px solid var(--border);padding:12px 0;overflow-y:auto}
  .dp-preset{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:13px;color:var(--ink);cursor:pointer}
  .dp-preset:hover{background:var(--surface-2)}
  .dp-radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--muted);flex:0 0 17px;
    display:grid;place-items:center}
  .dp-preset.active .dp-radio{border-color:var(--brand)}
  .dp-preset.active .dp-radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .dp-cals{flex:1;padding:22px 26px;display:flex;gap:30px}
  .dp-cal{flex:1;min-width:0}
  .dp-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .dp-cal-nav button{background:none;border:none;cursor:pointer;color:var(--ink-2);font-size:20px;
    padding:2px 8px;border-radius:6px;line-height:1}
  .dp-cal-nav button:hover{background:var(--surface-2);color:var(--ink)}
  .dp-cal-title{font-size:14px;font-weight:750;color:var(--ink);display:flex;align-items:center;gap:6px}
  .dp-cal-title svg{width:10px;height:10px;opacity:.45}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;font-weight:750;
    color:var(--muted);text-transform:uppercase;letter-spacing:.3px;text-align:center;margin-bottom:5px}
  .dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dp-day{height:36px;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink);
    border-radius:8px;cursor:pointer}
  .dp-day:hover:not(.dp-empty):not(.dp-outside){background:var(--surface-2)}
  .dp-day.dp-empty{cursor:default}
  .dp-day.dp-in-range{background:var(--sel);border-radius:0}
  .dp-day.dp-range-start{background:var(--brand);color:#fff;border-radius:8px 0 0 8px}
  .dp-day.dp-range-end{background:var(--brand);color:#fff;border-radius:0 8px 8px 0}
  .dp-day.dp-range-start.dp-range-end{border-radius:8px}
  .dp-day.dp-outside{color:var(--muted);opacity:.35;cursor:default}
  .dp-day.dp-today{font-weight:800;color:var(--brand)}
  .dp-day.dp-today.dp-range-start,.dp-day.dp-today.dp-range-end{color:#fff}
  .dp-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 26px;
    border-top:1px solid var(--border)}
  .dp-date-info{flex:1;font-size:12px;color:var(--muted)}
  .dp-btn{font:inherit;font-size:13px;font-weight:700;padding:9px 24px;border-radius:8px;cursor:pointer;border:none}
  .dp-btn-cancel{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
  .dp-btn-update{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
  .columns-wrap{position:relative}
  .control-btn{height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);
    padding:0 11px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;cursor:pointer}
  .control-btn:hover{background:var(--sel)}
  .control-btn svg{width:15px;height:15px}
  .columns-menu{position:absolute;right:0;top:43px;z-index:30;width:210px;padding:8px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
  .columns-menu label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
    color:var(--ink-2);font-size:12px;cursor:pointer}
  .columns-menu label:hover{background:var(--surface-2)}

  .summary-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:22px}
  .summary-card{--summary-accent:#8b5cf6;--summary-icon:#7042d6;--summary-value:#a78bfa;
    position:relative;min-width:0;min-height:180px;padding:18px 18px 0;
    border:1px solid #514179;border-radius:var(--r);background:#181527;
    box-shadow:var(--shadow);overflow:hidden}
  .summary-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--summary-accent)}
  .summary-card::after{content:"";position:absolute;inset:auto 0 0;height:78px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.02));pointer-events:none}
  .summary-card-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:start}
  .summary-card-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--summary-icon);color:#fff;
    font-size:10px;font-weight:850;line-height:1;letter-spacing:0;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
  .summary-card-label{min-width:0;color:#fff;font-size:11px;font-weight:650;letter-spacing:.48px;text-transform:uppercase;
    white-space:normal;overflow:hidden;text-overflow:clip;line-height:1.15;padding-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .summary-card-value{color:var(--summary-value);font-size:20px;font-weight:700;letter-spacing:0;line-height:1;font-feature-settings:"tnum";text-align:right;white-space:nowrap}
  .summary-card-spark{margin-top:10px;border-top:1px solid var(--border-2);padding-top:9px;position:relative;z-index:1}
  .summary-card-spark svg{width:100%;height:100%;display:block}
  .summary-card-spark text{font-family:inherit}
  .summary-card-tip{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;
    min-width:62px;padding:8px 10px;border-radius:8px;background:#111827;color:#fff;
    border:1px solid rgba(255,255,255,.10);box-shadow:0 10px 22px rgba(0,0,0,.36);
    font-size:12px;line-height:1.25;opacity:0;pointer-events:none;white-space:nowrap}
  .summary-card-tip.is-visible{opacity:1}
  .summary-card-tip b{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
  .summary-card.tone-spend{--summary-accent:#8b5cf6;--summary-icon:#7042d6;--summary-value:#a78bfa;background:#181527;border-color:#514179}
  .summary-card.tone-leads{--summary-accent:#6366f1;--summary-icon:#4f46e5;--summary-value:#8b90ff;background:#13172a;border-color:#3f4678}
  .summary-card.tone-cpl{--summary-accent:#3b82f6;--summary-icon:#2563eb;--summary-value:#63a0ff;background:#111a27;border-color:#31517b}
  .summary-card.tone-unique{--summary-accent:#06b6d4;--summary-icon:#0891b2;--summary-value:#67e8f9;background:#0f1e24;border-color:#28616d}
  .summary-card.tone-cac{--summary-accent:#14b8a6;--summary-icon:#0f766e;--summary-value:#5eead4;background:#0f1e1d;border-color:#28665d}
  .summary-card.tone-revenue{--summary-accent:#22c55e;--summary-icon:#15803d;--summary-value:#4ade80;background:#101d17;border-color:#2f6b48}
  .summary-card.tone-roas{--summary-accent:#a3e635;--summary-icon:#65a30d;--summary-value:#bef264;background:#151d10;border-color:#4f6b2f}
  @media(max-width:1180px){.summary-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:720px){.summary-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:420px){.summary-cards{grid-template-columns:1fr}}
  .manager{margin-top:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .tabs{display:flex;align-items:center;border-bottom:1px solid var(--border);padding:0 14px;gap:3px}
  .tab{position:relative;border:0;background:transparent;padding:13px 14px 11px;color:var(--muted);
    font-size:13px;font-weight:700;cursor:pointer}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink)}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--brand),var(--brand-3))}
  .tablebar{min-height:53px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .table-tools{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
  .context{display:flex;align-items:center;gap:7px;min-width:0;color:var(--muted);font-size:12px}
  .crumb{border:0;background:transparent;padding:0;color:var(--ink-2);font-weight:650;cursor:pointer}
  .crumb:hover{color:var(--brand)}
  .selected-crumb{color:var(--ink);font-weight:750}
  .selected-crumb:hover{text-decoration:underline}
  .context strong{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clear-selection{border:0;background:transparent;padding:2px 4px;color:var(--brand);font-size:11px;
    font-weight:700;cursor:pointer}
  .clear-selection:hover{text-decoration:underline}
  .row-status{font-size:11px;color:var(--muted);white-space:nowrap}

  .table-scroll{overflow:auto;height:calc(100vh - 210px);min-height:480px;max-height:760px;scrollbar-gutter:stable}
  table{width:100%;min-width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:11.5px}
  th,td{padding:4px 7px;border-right:1px solid var(--border-2);border-bottom:1px solid var(--border-2);white-space:nowrap;
    font-feature-settings:"tnum";text-align:right}
  td.url-cell{text-align:left}
  th:last-child,td:last-child{border-right:0}
  th{position:sticky;top:0;z-index:4;background:var(--surface-2);color:var(--muted);
    font-size:10px;font-weight:750;letter-spacing:.35px;text-transform:uppercase;overflow:visible}
  th.select-col,td.select-col{width:40px;text-align:center;position:sticky;left:0;z-index:3;background:var(--surface)}
  th.select-col{z-index:6;background:var(--surface-2)}
  th.select-col input,td.select-col input{width:14px;height:14px;margin:0;accent-color:var(--brand);cursor:pointer}
  th.entity,td.entity{text-align:left;position:sticky;left:0;z-index:2;background:var(--surface);
    min-width:0;max-width:none;overflow:hidden;box-shadow:1px 0 0 var(--border)}
  table.has-selection th.entity,table.has-selection td.entity{left:40px}
  th.entity{z-index:5;background:var(--surface-2)}
  .resize-handle{position:absolute;right:-4px;top:0;width:8px;height:100%;z-index:10;cursor:col-resize}
  .resize-handle[data-resize="adUrl"]{display:none;pointer-events:none}
  .resize-handle::after{content:"";position:absolute;right:3px;top:14%;bottom:14%;width:1px;background:var(--border)}
  .resize-handle:hover::after,body.resizing-columns .resize-handle::after{background:var(--brand)}
  body.resizing-columns{cursor:col-resize;user-select:none}
  tbody tr:hover td{background:var(--surface-2)}
  tbody tr:hover td.select-col{background:var(--surface-2)}
  tbody tr:hover td.entity{background:var(--surface-2)}
  .entity-line{display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;line-height:1.12}
  .entity-button{min-width:0;border:0;background:transparent;padding:0;display:inline-flex;align-items:center;
    gap:7px;color:var(--ink);font-weight:650;cursor:pointer;text-align:left}
  .entity-button:hover{color:var(--brand)}
  .entity-button span{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .entity-button svg{width:14px;height:14px;flex:0 0 auto;color:var(--muted)}
  .plain-entity{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
  .copy-btn{width:16px;height:16px;flex:0 0 16px;border:1px solid transparent;border-radius:5px;background:transparent;
    color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:.62;padding:0}
  .copy-btn svg{width:12px;height:12px;display:block}
  .copy-btn:hover{opacity:1;color:var(--ink);background:rgba(255,255,255,.07);border-color:var(--border)}
  .copy-btn.copied{color:var(--good);opacity:1}
  .subline{display:flex;align-items:center;gap:4px;margin-top:0;color:var(--muted);font-size:9px;overflow:hidden;line-height:1.05}
  .subline-text{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .entity-id{color:#8b8498}
  .url-link{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#8ab4ff;text-decoration:none;font-weight:650;vertical-align:bottom}
  .url-link:hover{text-decoration:underline}
  .platform-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;
    background:var(--surface-2);border:1px solid var(--border);font-size:10px;font-weight:700}
  .pdot{width:7px;height:7px;border-radius:50%}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:750}
  .status-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .status-active{color:var(--good)}
  .status-active::before{background:var(--good)}
  .status-paused{color:#9b93aa}
  .status-paused::before{background:#9b93aa}
  .status-warning{color:#d38b16}
  .status-warning::before{background:#e9a11b}
  .status-error{color:var(--bad)}
  .status-error::before{background:var(--bad)}
  .tracked{color:var(--good)}
  .untracked{color:var(--bad)}
  .good{color:var(--good);font-weight:700}
  .bad{color:var(--bad);font-weight:700}
  tfoot td{position:sticky;bottom:0;z-index:4;background:var(--surface-2);font-weight:750;
    border-top:2px solid var(--border);border-bottom:0}
  tfoot td.select-col{z-index:7;background:var(--surface-2)}
  tfoot td.entity{z-index:6;background:var(--surface-2)}
  .table-spacer,.table-spacer:hover{background:transparent!important}
  .table-spacer td,.table-spacer:hover td{height:0;padding:0;border-bottom:0;background:transparent!important}
  .empty{padding:52px 20px!important;text-align:center!important;color:var(--muted)}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;
    border-top:1px solid var(--border);font-size:11px;color:var(--muted);flex-wrap:wrap}
  .pager-controls{display:flex;align-items:center;gap:7px}
  .pager select{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);

  if(typeof value==="number")return value;

function parseDate(value){
  if(value instanceof Date)return new Date(value.getFullYear(),value.getMonth(),value.getDate());
  if(typeof value==="number"){
    const d=new Date(Math.round((value-25569)*864e5));
    return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  }
  const s=String(value||"").trim();
  const dmy=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(dmy)return new Date(+dmy[3],+dmy[2]-1,+dmy[1]);
  const d=new Date(s+"T00:00:00");
  return d;
}
function isoDate(date){
  if(!(date instanceof Date)||isNaN(date))return "";

}
function displayDate(date){

}
function calcPresetRange(id){
  const anchor=new Date(DATE_MAX),d=days=>new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()-days);
  let range;
  switch(id){
    case "today":range={start:new Date(anchor),end:new Date(anchor)};break;
    case "yesterday":range={start:d(1),end:d(1)};break;
    case "today_yesterday":range={start:d(1),end:new Date(anchor)};break;
    case "last_7":range={start:d(6),end:new Date(anchor)};break;
    case "last_14":range={start:d(13),end:new Date(anchor)};break;
    case "last_30":range={start:d(29),end:new Date(anchor)};break;
    case "this_week":{
      const dow=anchor.getDay();range={start:d(dow),end:new Date(anchor)};break;
    }
    case "last_week":{
      const dow=anchor.getDay();range={start:d(dow+7),end:d(dow+1)};break;
    }
    case "this_month":
      range={start:new Date(anchor.getFullYear(),anchor.getMonth(),1),end:new Date(anchor)};break;
    case "last_month":
      range={start:new Date(anchor.getFullYear(),anchor.getMonth()-1,1),
        end:new Date(anchor.getFullYear(),anchor.getMonth(),0)};break;
    case "maximum":range={start:new Date(DATE_MIN),end:new Date(DATE_MAX)};break;
    default:range={start:d(29),end:new Date(anchor)};
  }
  if(range.start<DATE_MIN)range.start=new Date(DATE_MIN);
  if(range.end>DATE_MAX)range.end=new Date(DATE_MAX);
  return range;
}
function dpPresetLabel(id){

function money(value){return "$"+Math.round(value||0).toLocaleString("en-US")}
function money2(value){return value==null?"-":"$"+Number(value).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function number(value){return Math.round(value||0).toLocaleString("en-US")}
function percent(value){return value==null?"-":(value*100).toFixed(2)+"%"}
function roas(value){return value==null?"-":value.toFixed(2)+"x"}
function mapPlatform(value){
  const source=String(value||"").toLowerCase();
  if(!source)return "Unknown";
  for(const platform of CONFIG.platforms){
    if(source===platform.key.toLowerCase()||platform.aliases.some(alias=>source===alias||source.includes(alias)))return platform.key;
  }
  return "Other";
}
function normalizeOffer(value,fallbackText=""){

  return "HCM";
}
function platformColor(name){

function normalizeFunnelPath(value){
  const raw=String(value||"").split(",")[0].trim();
  if(!raw)return UNKNOWN_FUNNEL;
  let path="";
  try{
    path=new URL(raw).pathname;
  }catch(err){
    const match=raw.match(/^https?:\/\/[^/?#\s]+([^?#\s]*)/i);
    path=match?match[1]:"";
  }
  if(!path)return UNKNOWN_FUNNEL;
  try{path=decodeURIComponent(path)}catch(err){}
  path=path.replace(/\/?\{ignore.*$/i,"").replace(/\/+$/,"")||"/";
  return path;
}
function funnelSort(a,b){
  if(a===UNKNOWN_FUNNEL)return 1;
  if(b===UNKNOWN_FUNNEL)return -1;
  return a.localeCompare(b);
}
function mapRows(rows){

    const genericStatus=String(row.Status||row["Delivery Status"]||row.Delivery||"").trim();
    const campaign=String(row.Campaign||row["Campaign Path"]||"").trim()||"(No campaign)";

    const destination=adUrl;
    const attribution=String(row["Attribution Status"]||row.Attribution||"").trim()||
      (row["Contact ID"]?"Lead-date attribution":"Platform spend row");

    const adsetKey=String(row["Ad Set Path"]||campaignKey+" > "+adset).trim();

    const offer=normalizeOffer(row.Offer,[campaign,adset,ad,destination,row["Tracked Funnel"],row["Funnel Name"],row["Source/Channel"]].join(" "));
    return {
    date:parseDate(row.Date),
    offer,
    platform:mapPlatform(source),
    campaign,adset,ad,campaignKey,adsetKey,adKey,
    campaignId:String(row["Campaign ID"]||row["Campaign Id"]||"").trim(),

    adId:String(row["Ad ID"]||row["Ad Id"]||"").trim(),
    campaignStatus:String(row["Campaign Status"]||row["Campaign Delivery"]||genericStatus).trim(),
    adsetStatus:String(row["Ad Set Status"]||row["Adset Status"]||row["Ad Set Delivery"]||genericStatus).trim(),
    adStatus:String(row["Ad Status"]||row["Effective Status"]||row["Ad Delivery"]||genericStatus).trim(),
    funnel:normalizeFunnelPath(adUrl),

    attribution,
    customerSaleDate:parseDate(row["Customer Sale Date"]||row["Sale Date"]),
    customerLeadDate:parseDate(row["Customer Lead Date"]||row["Lead Date"]),
    contactId:String(row["Contact ID"]||"").trim(),
    spend:cleanNumber(row.Spend),clicks:cleanNumber(row.Clicks),leads:cleanNumber(row.Lead),
    uniq:cleanNumber(row.Sale||row["New Customer"]),sameDay:0,

  }}).filter(row=>row.date instanceof Date&&!isNaN(row.date)&&
    (row.spend||row.clicks||row.leads||row.uniq||row.purchases||row.revenue));
}
function demoRows(){
  const entities=[
    ["Facebook","AE - HCM_9.22 - ABO - Sandbox - Lead Conv","AD3_9.22 - Not Tested - Broad - Female - 35-55 - 35 Horm States","Ad#4_B1H1","Hormone Code Masterclass","https://hormonecodemasterclass.com/"],
    ["Facebook","AE - HCM_9.22 - ABO - Sandbox - Lead Conv","AD5_9.22 - Not Tested - Broad - Female - 35-55 - 35 Horm States","AD5V4_H1_9.22","Hormone Code Masterclass","https://hormonecodemasterclass.com/"],
    ["Facebook","AE - HCM - ABO - Sandbox - Lead Conv","Statics_5A/5B_C5 - Broad - Female - 38-60 - 35 Horm States","AE - Ad#4_B1H1","Hormone Code Masterclass","https://hormonecodemasterclass.com/"],
    ["Facebook","AE - HCM - Vitamins and nutritional supplements - CBO - Lead Conv","Broad - Female - 38-60","AE - Ad#4_B","Hormone Code Masterclass","https://hormonecodemasterclass.com/"],
    ["Google","AE - HCM - Search","Hormone Masterclass","Responsive search ad","Hormone Code Masterclass","https://hormonecodemasterclass.com/"],
    ["Facebook","AE - HCM - Organic & Natural Product - CBO - Lead Conv","Broad - Female - 38-60","AE - Ad#3_B1H2","Hormone Code Masterclass","https://hormonecodemasterclass.com/"],
    ["Email","past attendees","activecampaign","Email 1","Hormone Code Masterclass","https://hormonecodemasterclass.com/"]
  ];
  const rows=[];
  for(let day=0;day<45;day++){
    const date=new Date(2026,5,1+day);
    entities.forEach((entity,index)=>{
      const wave=1+Math.sin((day+index)*.72)*.18;
      const spend=Math.max(0,Math.round((48+index*16)*wave*100)/100);
      const clicks=Math.max(0,Math.round((37-index*3)*wave));
      const leads=Math.max(0,Math.round(clicks*(.06+index*.008)));
      const uniq=(day+index)%13===0?1:0;
      const purchases=uniq+((day+index)%17===0?1:0);
      const sameDay=uniq&&index%3===0?uniq:0,later=uniq&&index%3===1?uniq:0;
      const unknown=Math.max(0,uniq-sameDay-later);
      const delivery=index===4?"Paused":"Active";
      const campaignKey=entity[1],adsetKey=campaignKey+" > "+entity[2],adKey=adsetKey+" > "+entity[3];
      rows.push({date,platform:entity[0],campaign:entity[1],adset:entity[2],ad:entity[3],
        offer:normalizeOffer("",[entity[1],entity[2],entity[3],entity[4],entity[5]].join(" ")),
        campaignKey,adsetKey,adKey,
        campaignId:"238"+String(100000000000000+index).slice(1),
        adSetId:"238"+String(200000000000000+index).slice(1),

        campaignStatus:delivery,adsetStatus:delivery,adStatus:delivery,funnel:entity[4],

        spend,clicks,leads,uniq,sameDay,later,unknown,purchases,revenue:purchases*(210+index*35)});
    });
  }
  return rows;
}
function apiPath(path){return (location.protocol==="file:"?"http://127.0.0.1:8787":"")+path}
async function loadData(){
  if(new URLSearchParams(location.search).has("preview")){
    LIVE_TS=new Date().toISOString();
    return demoRows();
  }
  const response=await fetch(CONFIG.dataUrl,{cache:"no-store",credentials:"same-origin"});
  if(response.status===401){const error=new Error("Password required");error.code="AUTH_REQUIRED";throw error}
  if(!response.ok){
    let detail="";
    try{
      const payload=await response.json();
      detail=payload.detail||payload.error||"";
    }catch(err){}
    throw new Error("Reporting API failed: "+response.status+(detail?" - "+detail:""));
  }
  const payload=await response.json();
  LIVE_TS=payload.dataUpdatedAt||"";
  return mapRows(payload.rows||[]);
}

    const end=new Date(Math.min(+state.end,+DATE_MAX));
    if(start<=end){state.start=start;state.end=end}
    else{
      state.range="last_30";
      const range=calcPresetRange(state.range);
      state.start=range.start;state.end=range.end;
    }
  }
  dpUpdateTrigger();
}

function dateInRange(date,start,end){
  return date instanceof Date&&!isNaN(date)&&+date>=start&&+date<=end;
}
function rowPassesDateRange(row,start,end){
  const hasDeliveryMetric=!!(row.spend||row.clicks||row.leads);
  const hasCustomerMetric=!!(row.uniq||row.sameDay||row.later||row.unknown);
  const hasPurchaseMetric=!!(row.purchases||row.revenue);
  const deliveryInRange=hasDeliveryMetric&&dateInRange(row.date,start,end);
  const saleDate=row.customerSaleDate instanceof Date&&!isNaN(row.customerSaleDate)
    ?row.customerSaleDate
    :row.date;
  const hasLeadDate=row.customerLeadDate instanceof Date&&!isNaN(row.customerLeadDate);
  const customerDate=hasLeadDate?row.customerLeadDate:saleDate;
  const customerInRange=hasCustomerMetric&&dateInRange(customerDate,start,end);
  const purchaseInRange=hasPurchaseMetric&&dateInRange(saleDate,start,end);
  return deliveryInRange||customerInRange||purchaseInRange;
}
function summarize(rows,startDate=state.start,endDate=state.end){
  const start=+startDate,end=+endDate;
  const summary={spend:0,clicks:0,leads:0,uniq:0,sameDay:0,later:0,unknown:0,
    purchases:0,revenue:0,timeToMatureDays:0,timeToMatureCustomers:0};
  const leadKeys=new Set();
  const salesKeys=new Set();
  const purchaseKeys=new Set();
  rows.forEach(row=>{
    const saleDate=row.customerSaleDate instanceof Date&&!isNaN(row.customerSaleDate)
      ?row.customerSaleDate
      :row.date;
    const hasLeadDate=row.customerLeadDate instanceof Date&&!isNaN(row.customerLeadDate);
    const customerDate=hasLeadDate?row.customerLeadDate:saleDate;
    if(dateInRange(row.date,start,end)){
      summary.spend+=row.spend||0;
      summary.clicks+=row.clicks||0;
      if(row.leads){
        const leadKey=(row.contactId||[row.platform,row.campaignKey,row.adsetKey,row.adKey,+row.date].join("|"))+"::"+(state.offer==="all"?"all":row.offer);
        if(!leadKeys.has(leadKey)){
          leadKeys.add(leadKey);
          summary.leads+=1;
        }
      }
    }
    if(dateInRange(saleDate,start,end)){
      if(row.purchases){
        const purchaseKey=(row.contactId||[row.platform,row.campaignKey,row.adsetKey,row.adKey,+saleDate,row.revenue].join("|"))+"::"+(state.offer==="all"?"all":row.offer);
        if(!purchaseKeys.has(purchaseKey)){
          purchaseKeys.add(purchaseKey);
          summary.purchases+=1;
        }
      }
      summary.revenue+=row.revenue||0;
    }
    if(dateInRange(customerDate,start,end)){
        if(row.uniq){
          const salesKey=row.contactId||[row.platform,row.campaignKey,row.adsetKey,row.adKey,+customerDate].join("|");
          if(!salesKeys.has(salesKey)){
            salesKeys.add(salesKey);
            summary.uniq+=1;
          }
        }
        if(row.uniq&&hasLeadDate&&saleDate>=row.customerLeadDate){
          const matureDays=Math.round((+saleDate-+row.customerLeadDate)/864e5);
          summary.timeToMatureDays+=matureDays*row.uniq;
          summary.timeToMatureCustomers+=row.uniq;
        }
    }
  });
  summary.leadCvr=summary.clicks?summary.leads/summary.clicks:null;
  summary.cpl=summary.leads?summary.spend/summary.leads:null;
  summary.cpc=summary.clicks?summary.spend/summary.clicks:null;
  summary.cac=summary.uniq?summary.spend/summary.uniq:null;
  const metaOnly=rows.length>0&&rows.every(row=>row.platform==="Facebook");
  summary.projectedSales=metaOnly?summary.uniq/META_DAY_7_MATURITY:null;
  summary.projectedCac=summary.projectedSales>0?summary.spend/summary.projectedSales:null;
  summary.sameDayCac=summary.sameDay?summary.spend/summary.sameDay:null;
  summary.cpp=summary.purchases?summary.spend/summary.purchases:null;
  summary.roas=summary.spend?summary.revenue/summary.spend:null;
  summary.purchaseRate=summary.leads?summary.purchases/summary.leads:null;
  summary.coldPurchaseRate=summary.clicks?summary.uniq/summary.clicks:null;
  summary.timeToMature=summary.timeToMatureCustomers
    ?summary.timeToMatureDays/summary.timeToMatureCustomers
    :null;
  summary.leadCloseCvr=summary.leads?summary.uniq/summary.leads:null;
  summary.aov=summary.purchases?summary.revenue/summary.purchases:null;
  return summary;
}
function trendDates(){
  const start=new Date(state.start),end=new Date(state.end);
  const days=Math.max(0,Math.round((+end-+start)/864e5));
  const step=Math.max(1,Math.ceil((days+1)/45));
  const dates=[];
  for(let i=0;i<=days;i+=step){
    dates.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));
  }
  if(+dates[dates.length-1]!==+end)dates.push(end);
  return dates;
}
function smoothPath(points){
  if(!points.length)return "";
  if(points.length===1)return "M"+points[0].x.toFixed(1)+" "+points[0].y.toFixed(1);
  let d="M"+points[0].x.toFixed(1)+" "+points[0].y.toFixed(1);
  for(let i=0;i<points.length-1;i++){
    const p0=points[Math.max(0,i-1)],p1=points[i],p2=points[i+1],p3=points[Math.min(points.length-1,i+2)];
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=" C"+c1x.toFixed(1)+" "+c1y.toFixed(1)+", "+c2x.toFixed(1)+" "+c2y.toFixed(1)+", "+p2.x.toFixed(1)+" "+p2.y.toFixed(1);
  }
  return d;
}
function summaryCardSpark(card,series,dates){
  const W=420,H=150,pl=0,pr=10,pt=6,pb=46,iw=W-pl-pr,ih=H-pt-pb,n=series.length||1;
  const max=Math.max(card.adaptive?0.01:1,...series)*1.18;
  const X=i=>pl+(n<=1?iw/2:iw*i/(n-1));
  const Y=v=>pt+ih-ih*(v/max);
  const points=series.map((value,i)=>({x:X(i),y:Y(value)}));
  const line=smoothPath(points);
  const area=line+" L"+X(n-1).toFixed(1)+" "+(pt+ih)+" L"+X(0).toFixed(1)+" "+(pt+ih)+" Z";
  const id="g_"+card.key+"_"+Math.random().toString(36).slice(2);
  const idxs=n<=1?[0]:[0,Math.floor((n-1)/2),n-1];
  const labels=[...new Set(idxs)].map((i,k,arr)=>{
    const anchor=k===0?"start":(k===arr.length-1?"end":"middle");
    return '<text x="'+X(i).toFixed(1)+'" y="'+(H-2)+'" text-anchor="'+anchor+'" font-size="13" fill="#7f8a9d">'+displayDate(dates[i])+'</text>';
  }).join("");
  let hits="";
  series.forEach((value,i)=>{
    const width=iw/n;
    hits+='<rect x="'+(X(i)-width/2).toFixed(1)+'" y="'+pt+'" width="'+width.toFixed(1)+'" height="'+ih+'" fill="transparent" data-i="'+i+'" data-date="'+esc(displayDate(dates[i]))+'" data-value="'+esc(card.format(value))+'" data-x="'+X(i).toFixed(1)+'" data-y="'+Y(value).toFixed(1)+'"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" aria-label="'+esc(card.label)+' trend">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="'+card.color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+card.color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+pl+'" y1="'+pt+'" x2="'+(W-pr)+'" y2="'+pt+'" stroke="var(--border-2)"/>'+
    labels+'<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+card.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<line class="spark-guide" x1="0" y1="'+pt+'" x2="0" y2="'+(pt+ih)+'" stroke="rgba(255,255,255,.30)" stroke-width="1" stroke-dasharray="3 3" style="opacity:0"/>'+
    '<circle class="spark-dot" r="6.5" fill="'+card.color+'" stroke="var(--surface)" stroke-width="3" style="opacity:0"/>'+hits+
  '</svg>';
}

function campaignStatusRank(status){
  const value=String(status||"").toLowerCase();
  if(value.includes("active")||value.includes("enabled"))return 0;
  if(value.includes("learn")||value.includes("review")||value.includes("limited"))return 1;
  if(value.includes("pause")||value.includes("inactive"))return 2;
  if(value.includes("error")||value.includes("reject")||value.includes("disabled"))return 3;
  return value?4:5;
}
function groupedRows(){
  const field=LEVELS[state.level].field,keyField=state.level+"Key",statusField=state.level+"Status",map=new Map();
  filteredRows().forEach(row=>{
    const name=row[field],key=row[keyField];
    let item=map.get(key);
    if(!item){
      item={name,key,platforms:new Set(),funnels:new Set(),destinations:new Set(),statuses:new Set(),
        deliveryStatuses:new Set(),campaignIds:new Set(),adSetIds:new Set(),adIds:new Set(),adUrls:new Set(),rows:[]};
      map.set(key,item);
    }
    item.rows.push(row);item.platforms.add(row.platform);item.funnels.add(row.funnel);
    if(row.destination)item.destinations.add(row.destination);
    if(row.campaignId)item.campaignIds.add(row.campaignId);
    if(row.adSetId)item.adSetIds.add(row.adSetId);
    if(row.adId)item.adIds.add(row.adId);
    if(row.adUrl)item.adUrls.add(row.adUrl);
    if(row.attribution)item.statuses.add(row.attribution);
    if(row[statusField])item.deliveryStatuses.add(row[statusField]);
  });
  const list=[...map.values()].map(item=>{
    Object.assign(item,summarize(item.rows));
    item.platform=[...item.platforms].join(", ");
    item.funnel=[...item.funnels].join(", ");
    item.destination=[...item.destinations].join(", ");
    item.campaignId=[...item.campaignIds].join(", ");
    item.adSetId=[...item.adSetIds].join(", ");
    item.adId=[...item.adIds].join(", ");
    item.adUrl=[...item.adUrls].join(", ");
    item.attribution=[...item.statuses].join("; ");
    item.status=item.deliveryStatuses.size>1?"Mixed":[...item.deliveryStatuses][0]||"";
    return item;
  });
  const direction=state.sortDir==="asc"?1:-1;
  list.sort((a,b)=>{
    if(state.level==="campaign"){
      const statusDifference=campaignStatusRank(a.status)-campaignStatusRank(b.status);
      if(statusDifference)return statusDifference;
    }
    const av=a[state.sortKey],bv=b[state.sortKey];
    const metricDifference=typeof av==="number"&&typeof bv==="number"
      ?(av-bv)*direction
      :String(av||"").localeCompare(String(bv||""))*direction;
    return metricDifference||String(a.name||"").localeCompare(String(b.name||""));
  });
  return list;
}
function formatCell(item,column){
  const value=item[column.key];
  if((column.key==="projectedSales"||column.key==="projectedCac")&&value==null)return "&mdash;";
  if(column.key==="status"){
    const label=String(value||"").trim();
    if(!label)return "-";
    const normalized=label.toLowerCase();
    const className=normalized.includes("active")||normalized.includes("enabled")?"status-active":
      normalized.includes("pause")||normalized.includes("inactive")?"status-paused":
      normalized.includes("error")||normalized.includes("reject")||normalized.includes("disabled")?"status-error":
      normalized.includes("learn")||normalized.includes("review")||normalized.includes("limited")?"status-warning":"";
    return '<span class="status-pill '+className+'">'+esc(label)+'</span>';
  }
  if(column.key==="platform"){
    const names=[...item.platforms];
    return names.map(name=>'<span class="platform-pill"><span class="pdot" style="background:'+platformColor(name)+'"></span>'+esc(name)+'</span>').join(" ");
  }
  if(column.key==="attribution"){
    const status=String(value||"");
    return '<span class="'+(status.toLowerCase().includes("no utm")||status.toLowerCase().includes("untracked")?"untracked":"tracked")+'">'+esc(status||"-")+'</span>';
  }
  if(column.kind==="money")return value==null?"-":money(value);
  if(column.kind==="money2")return money2(value);
  if(column.kind==="number")return number(value);
  if(column.kind==="number2")return Number(value).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  if(column.kind==="days")return value==null?"-":value.toFixed(1)+" days";
  if(column.kind==="percent")return percent(value);

  if(column.kind==="url")return formatUrlCell(value);

}
function currentSelection(){
  if(state.level==="campaign")return state.selectedCampaigns;
  if(state.level==="adset")return state.selectedAdsets;
  return state.selectedAds;
}
function selectedLabel(selection,singular,plural){
  if(!selection.size)return "";
  if(selection.size===1){
    const key=[...selection][0],row=DATA.find(item=>
      singular==="campaign"?item.campaignKey===key:item.adsetKey===key);
    return row?(singular==="campaign"?row.campaign:row.adset):"1 "+singular+" selected";
  }
  return selection.size+" "+plural+" selected";
}
function renderColgroup(visible,selectable){
  const keys=["entity",...visible.map(column=>column.key)];
  const widths=state.autoFit?fittedWidths(keys,selectable):state.widths;
  const urlWidth=keys.includes("adUrl")?dynamicUrlWidth():DEFAULT_WIDTHS.adUrl;
  const widthFor=key=>key==="adUrl"?urlWidth:widths[key];
  $("tableCols").innerHTML=(selectable?'<col style="width:40px">':"")+keys.map(key=>
    '<col data-col="'+key+'" style="width:'+widthFor(key)+'px">').join("");
  const table=$("tableCols").closest("table");
  table.classList.toggle("has-selection",selectable);
  const total=(selectable?40:0)+keys.reduce((sum,key)=>sum+widthFor(key),0);
  table.style.width=total+"px";
  table.style.minWidth="100%";
}
function fittedWidths(keys,selectable){
  const base={...state.widths};
  const scroller=document.querySelector(".table-scroll");
  const available=Math.max(0,(scroller?scroller.clientWidth:0)-(selectable?40:0)-2);
  const baseTotal=keys.reduce((sum,key)=>sum+(base[key]||DEFAULT_WIDTHS[key]||80),0);
  if(!available||baseTotal<=available)return base;

  const fitted={};
  let total=0;
  keys.forEach(key=>{
    const min=MIN_WIDTHS[key]||56;
    const value=Math.max(min,Math.floor((base[key]||DEFAULT_WIDTHS[key]||80)*available/baseTotal));
    fitted[key]=value;
    total+=value;
  });

  const overflow=total-available;
  if(overflow>0&&fitted.entity>(MIN_WIDTHS.entity||210)){
    fitted.entity=Math.max(MIN_WIDTHS.entity||210,fitted.entity-overflow);
  }
  return fitted;
}
function measureTextWidth(text,font){
  const canvas=measureTextWidth.canvas||(measureTextWidth.canvas=document.createElement("canvas"));
  const context=canvas.getContext("2d");
  context.font=font||'650 11.5px system-ui,-apple-system,"Segoe UI",sans-serif';
  return context.measureText(String(text||"")).width;
}
function dynamicUrlWidth(){
  const rows=groupedRows().slice((state.page-1)*state.pageSize,state.page*state.pageSize);
  const maxTextWidth=rows.reduce((max,item)=>{
    const urls=String(item.adUrl||"").split(",").map(url=>url.trim()).filter(Boolean);
    return Math.max(max,...urls.map(url=>measureTextWidth(url)));
  },0);
  if(!maxTextWidth)return DEFAULT_WIDTHS.adUrl;
  const headerWidth=measureTextWidth("Ad URL",'750 10px system-ui,-apple-system,"Segoe UI",sans-serif');
  return Math.max(76,Math.min(520,Math.ceil(Math.max(maxTextWidth,headerWidth))+18));
}
function installColumnResizers(visible){
  document.querySelectorAll(".resize-handle").forEach(handle=>handle.addEventListener("pointerdown",event=>{
    event.preventDefault();event.stopPropagation();
    state.autoFit=false;
    const key=handle.dataset.resize,startX=event.clientX;
    const currentCol=$("tableCols").querySelector('[data-col="'+key+'"]');
    const startWidth=currentCol?parseFloat(currentCol.style.width)||state.widths[key]:state.widths[key];
    document.body.classList.add("resizing-columns");
    const move=moveEvent=>{
      state.widths[key]=Math.max(key==="entity"?140:72,Math.min(600,startWidth+moveEvent.clientX-startX));
      const col=$("tableCols").querySelector('[data-col="'+key+'"]');
      if(col)col.style.width=state.widths[key]+"px";
      const keys=["entity",...visible.map(column=>column.key)];
      $("tableCols").closest("table").style.width=((currentSelection()?40:0)+
        keys.reduce((sum,item)=>sum+(item==="adUrl"?dynamicUrlWidth():state.widths[item]),0))+"px";
    };
    const up=()=>{
      document.body.classList.remove("resizing-columns");
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
  }));
}
function renderContext(){
  const pieces=['<button class="crumb" type="button" data-context="all">All campaigns</button>'];
  if(state.level!=="campaign"&&state.selectedCampaigns.size){
    pieces.push('<span>/</span><button class="crumb selected-crumb" type="button" data-context="campaign">'+
      esc(selectedLabel(state.selectedCampaigns,"campaign","campaigns"))+'</button>');
  }
  if(state.level==="ad"&&state.selectedAdsets.size){
    pieces.push('<span>/</span><button class="crumb selected-crumb" type="button" data-context="adset">'+
      esc(selectedLabel(state.selectedAdsets,"ad set","ad sets"))+'</button>');
  }
  if(state.selectedCampaigns.size||state.selectedAdsets.size){
    pieces.push('<button class="clear-selection" type="button" data-context="clear">Clear selection</button>');
  }
  $("context").innerHTML=pieces.join("");
  $("context").querySelectorAll("[data-context]").forEach(button=>button.addEventListener("click",()=>{
    if(button.dataset.context==="all"){
      state.selectedCampaigns.clear();state.selectedAdsets.clear();state.selectedAds.clear();state.level="campaign";
    }else if(button.dataset.context==="campaign"){
      state.selectedAdsets.clear();state.selectedAds.clear();state.level="adset";
    }else if(button.dataset.context==="adset"){
      state.selectedAds.clear();state.level="ad";
    }else{
      state.selectedCampaigns.clear();state.selectedAdsets.clear();state.selectedAds.clear();
    }
    state.page=1;render();
  }));
}
function renderTable(){
  const list=groupedRows(),visible=COLUMNS.filter(column=>state.visible.has(column.key)&&
    (column.key!=="adUrl"||state.level==="ad"));
  const selection=currentSelection(),selectable=Boolean(selection);
  const pageCount=Math.max(1,Math.ceil(list.length/state.pageSize));
  if(state.page>pageCount)state.page=pageCount;
  const start=(state.page-1)*state.pageSize,pageRows=list.slice(start,start+state.pageSize);
  renderColgroup(visible,selectable);
  const selectHead=selectable?'<th class="select-col"><input id="selectPage" type="checkbox" aria-label="Select visible '+LEVELS[state.level].plural.toLowerCase()+'"></th>':"";
  const head='<tr>'+selectHead+'<th class="entity"><button class="entity-button" type="button" data-sort="name">'+LEVELS[state.level].label+
    (state.sortKey==="name"?(state.sortDir==="asc"?" ↑":" ↓"):"")+'</button><span class="resize-handle" data-resize="entity"></span></th>'+
    visible.map(column=>'<th><button class="entity-button" type="button" data-sort="'+column.key+'">'+column.label+
      (state.sortKey===column.key?(state.sortDir==="asc"?" ↑":" ↓"):"")+'</button><span class="resize-handle" data-resize="'+column.key+'"></span></th>').join("")+'</tr>';
  $("tableHead").innerHTML=head;
  if(!pageRows.length){
    $("tableBody").innerHTML='<tr><td class="empty" colspan="'+(visible.length+1+(selectable?1:0))+'">No rows match the selected filters.</td></tr>';
    $("tableFoot").innerHTML="";
  }else{
    const columnCount=visible.length+1+(selectable?1:0);
    $("tableBody").innerHTML=pageRows.map(item=>{
      const selectCell=selectable?'<td class="select-col"><input class="row-check" type="checkbox" data-select-key="'+
        esc(item.key)+'" aria-label="Select '+esc(item.name)+'" '+(selection.has(item.key)?"checked":"")+'></td>':"";
      return '<tr>'+selectCell+'<td class="entity">'+entityHtml(item)+'</td>'+
        visible.map(column=>'<td'+(column.key==="adUrl"?' class="url-cell"':"")+'>'+formatCell(item,column)+'</td>').join("")+'</tr>';
    }).join("")+'<tr class="table-spacer" aria-hidden="true"><td colspan="'+columnCount+'"></td></tr>';
    const totalRows=filteredRows(false,true),total=summarize(totalRows);
    total.platforms=new Set(totalRows.map(row=>row.platform));total.funnels=new Set(totalRows.map(row=>row.funnel));
    total.platform=[...total.platforms].join(", ");total.funnel=[...total.funnels].join(", ");
    total.destination="";total.attribution="";total.campaignId="";total.adSetId="";total.adId="";total.adUrl="";
    $("tableFoot").innerHTML='<tr>'+(selectable?'<td class="select-col"></td>':"")+'<td class="entity">Total</td>'+
      visible.map(column=>'<td'+(column.key==="adUrl"?' class="url-cell"':"")+'>'+formatCell(total,column)+'</td>').join("")+'</tr>';
  }
  $("tableHead").querySelectorAll("[data-sort]").forEach(button=>button.addEventListener("click",()=>{
    const key=button.dataset.sort;
    if(state.sortKey===key)state.sortDir=state.sortDir==="asc"?"desc":"asc";
    else{state.sortKey=key;state.sortDir=key==="name"?"asc":"desc"}
    renderTable();
  }));
  installColumnResizers(visible);
  $("tableBody").querySelectorAll("[data-copy]").forEach(button=>button.addEventListener("click",event=>{
    event.preventDefault();event.stopPropagation();
    copyText(button.dataset.copy||"",button);
  }));
  $("tableBody").querySelectorAll("[data-drill]").forEach(button=>button.addEventListener("click",()=>{
    if(state.level==="campaign"){
      state.selectedCampaigns.clear();state.selectedCampaigns.add(button.dataset.drill);
      state.selectedAdsets.clear();state.selectedAds.clear();state.level="adset";
    }else if(state.level==="adset"){
      state.selectedAdsets.clear();state.selectedAdsets.add(button.dataset.drill);state.selectedAds.clear();state.level="ad";
    }
    state.page=1;render();
  }));
  if(selectable){
    $("tableBody").querySelectorAll(".row-check").forEach(input=>input.addEventListener("change",()=>{
      if(input.checked)selection.add(input.dataset.selectKey);else selection.delete(input.dataset.selectKey);
      if(state.level==="campaign"){state.selectedAdsets.clear();state.selectedAds.clear()}
      if(state.level==="adset")state.selectedAds.clear();
      render();
    }));
    const selectPage=$("selectPage");
    if(selectPage){
      const selectedOnPage=pageRows.filter(item=>selection.has(item.key)).length;
      selectPage.checked=Boolean(pageRows.length&&selectedOnPage===pageRows.length);
      selectPage.indeterminate=selectedOnPage>0&&selectedOnPage<pageRows.length;
      selectPage.addEventListener("change",()=>{
        pageRows.forEach(item=>selectPage.checked?selection.add(item.key):selection.delete(item.key));
        if(state.level==="campaign"){state.selectedAdsets.clear();state.selectedAds.clear()}
        if(state.level==="adset")state.selectedAds.clear();
        render();
      });
    }
  }
  $("pageSummary").textContent=list.length?"Showing "+(start+1)+"-"+Math.min(start+state.pageSize,list.length)+" of "+list.length:"0 rows";
  $("prevPage").disabled=state.page<=1;$("nextPage").disabled=state.page>=pageCount;
  updateRowStatus(list.length);
  pinTotalRow();
}
function pinTotalRow(){
  requestAnimationFrame(()=>{
    const scroller=document.querySelector(".table-scroll");
    const spacer=$("tableBody").querySelector(".table-spacer td");
    if(!scroller||!spacer||!$("tableFoot").rows.length)return;
    spacer.style.height="0px";
    const headerHeight=$("tableHead").getBoundingClientRect().height;
    const footerHeight=$("tableFoot").getBoundingClientRect().height;
    const rowHeight=[...$("tableBody").rows]
      .filter(row=>!row.classList.contains("table-spacer"))
      .reduce((sum,row)=>sum+row.getBoundingClientRect().height,0);
    spacer.style.height=Math.max(0,scroller.clientHeight-headerHeight-footerHeight-rowHeight)+"px";
  });
}
function updateRowStatus(total){
  const selection=currentSelection();
  $("rowStatus").textContent=(selection&&selection.size?selection.size+" selected - ":"")+
    total+" "+LEVELS[state.level].plural.toLowerCase();
}
function render(){
  document.querySelectorAll(".tab").forEach(tab=>tab.setAttribute("aria-selected",String(tab.dataset.level===state.level)));
  renderSummaryCards();renderContext();renderTable();
}
function resetHierarchy(){
  state.selectedCampaigns.clear();state.selectedAdsets.clear();state.selectedAds.clear();state.level="campaign";state.page=1;
}
function reconcileHierarchy(){
  const offerRows=dataForCurrentOffer();
  const campaigns=new Set(offerRows.map(row=>row.campaignKey));
  const adsets=new Set(offerRows.map(row=>row.adsetKey));
  const ads=new Set(offerRows.map(row=>row.adKey));
  [...state.selectedCampaigns].forEach(key=>{if(!campaigns.has(key))state.selectedCampaigns.delete(key)});
  [...state.selectedAdsets].forEach(key=>{if(!adsets.has(key))state.selectedAdsets.delete(key)});
  [...state.selectedAds].forEach(key=>{if(!ads.has(key))state.selectedAds.delete(key)});
  if(state.level!=="campaign"&&!state.selectedCampaigns.size){
    state.level="campaign";state.selectedAdsets.clear();state.selectedAds.clear();
  }else if(state.level==="ad"&&!state.selectedAdsets.size){
    state.level="adset";state.selectedAds.clear();
  }
}
function dpOpen(){
  dp.selStart=new Date(state.start);dp.selEnd=new Date(state.end);
  dp.preset=state.range;dp.picking=false;
  dp.leftMonth=state.start.getMonth();dp.leftYear=state.start.getFullYear();
  let rightMonth=dp.leftMonth+1,rightYear=dp.leftYear;
  if(rightMonth>11){rightMonth=0;rightYear++}
  if(state.end.getFullYear()>rightYear||
    (state.end.getFullYear()===rightYear&&state.end.getMonth()>=rightMonth)){
    rightYear=state.end.getFullYear();rightMonth=state.end.getMonth();
    dp.leftMonth=rightMonth-1;dp.leftYear=rightYear;
    if(dp.leftMonth<0){dp.leftMonth=11;dp.leftYear--}
  }
  dpRender();$("dpOverlay").classList.add("open");
}
function dpClose(){
  $("dpOverlay").classList.remove("open");
}
function dpRender(){
  dpRenderPresets();dpRenderCal("dpCalL",dp.leftYear,dp.leftMonth,true);
  let rightMonth=dp.leftMonth+1,rightYear=dp.leftYear;
  if(rightMonth>11){rightMonth=0;rightYear++}
  dpRenderCal("dpCalR",rightYear,rightMonth,false);dpRenderFooter();
}
function dpRenderPresets(){
  $("dpPresets").innerHTML=DP_PRESETS.map(preset=>
    '<div class="dp-preset'+(dp.preset===preset.id?" active":"")+'" data-preset="'+preset.id+'">'+
    '<span class="dp-radio"></span><span>'+preset.label+'</span></div>').join("");
  $("dpPresets").querySelectorAll("[data-preset]").forEach(element=>element.addEventListener("click",()=>{
    dp.preset=element.dataset.preset;dp.picking=false;
    const range=calcPresetRange(dp.preset);dp.selStart=range.start;dp.selEnd=range.end;
    dp.leftMonth=range.start.getMonth();dp.leftYear=range.start.getFullYear();dpRender();
  }));
}
function dpRenderCal(hostId,year,month,showLeft){
  const weekdays=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const first=new Date(year,month,1),last=new Date(year,month+1,0);
  let nav='<div class="dp-cal-nav">';
  nav+=showLeft?'<button class="dp-arr" type="button" data-dir="-1" aria-label="Previous month">&lt;</button>':"<div></div>";
  nav+='<span class="dp-cal-title">'+MONTH_NAMES[month]+
    ' <svg viewBox="0 0 10 10"><path d="M2 3l3 4 3-4" fill="currentColor"/></svg> '+year+
    ' <svg viewBox="0 0 10 10"><path d="M2 3l3 4 3-4" fill="currentColor"/></svg></span>';
  nav+=showLeft?"<div></div>":'<button class="dp-arr" type="button" data-dir="1" aria-label="Next month">&gt;</button>';
  nav+="</div>";
  const week='<div class="dp-weekdays">'+weekdays.map(day=>"<span>"+day+"</span>").join("")+"</div>";
  let days='<div class="dp-days">';
  for(let index=0;index<first.getDay();index++)days+='<div class="dp-day dp-empty"></div>';
  for(let day=1;day<=last.getDate();day++){
    const date=new Date(year,month,day),time=+date;
    let className="dp-day";
    if(date<DATE_MIN||date>DATE_MAX)className+=" dp-outside";
    if(dp.selStart&&dp.selEnd){
      const start=+dp.selStart,end=+dp.selEnd;
      if(time>=start&&time<=end)className+=" dp-in-range";
      if(time===start)className+=" dp-range-start";
      if(time===end)className+=" dp-range-end";
    }
    const today=new Date(),todayDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    if(time===+todayDate)className+=" dp-today";
    days+='<div class="'+className+'" data-date="'+isoDate(date)+'">'+day+"</div>";
  }
  days+="</div>";
  const host=$(hostId);host.innerHTML=nav+week+days;
  host.querySelectorAll(".dp-arr").forEach(button=>button.addEventListener("click",()=>{
    dp.leftMonth+=Number(button.dataset.dir);
    if(dp.leftMonth>11){dp.leftMonth=0;dp.leftYear++}
    if(dp.leftMonth<0){dp.leftMonth=11;dp.leftYear--}
    dpRender();
  }));
  host.querySelectorAll(".dp-day:not(.dp-empty):not(.dp-outside)").forEach(element=>
    element.addEventListener("click",()=>{
      const parts=element.dataset.date.split("-");
      const clicked=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
      if(!dp.picking){dp.selStart=clicked;dp.selEnd=clicked;dp.picking=true}
      else{
        if(clicked<dp.selStart){dp.selEnd=new Date(dp.selStart);dp.selStart=clicked}
        else dp.selEnd=clicked;
        dp.picking=false;
      }
      dp.preset="custom";dpRender();
    }));
}
function dpRenderFooter(){
  $("dpDateInfo").textContent=dp.selStart&&dp.selEnd?
    displayDate(dp.selStart)+" "+dp.selStart.getFullYear()+" - "+
      displayDate(dp.selEnd)+" "+dp.selEnd.getFullYear():
    "Select a date range";
}
async function boot(preserveState=false){
  setMode("Refreshing","Refreshing...");
  $("refreshBtn").classList.add("spin");
  $("dataNotice").classList.add("hidden");
  try{
    const rows=await loadData();
    if(!rows.length)throw new Error("No reporting rows returned");
    DATA=rows;hideLogin();
    if(preserveState)reconcileHierarchy();else resetHierarchy();
    populateOfferMenu();populateFilters();setBounds(preserveState);renderColumnsMenu();render();
    setMode("Live",LIVE_TS
      ?"Live - data pulled "+new Date(LIVE_TS).toLocaleString()
      :"Live - data pull time unavailable");
  }catch(error){
    if(error.code==="AUTH_REQUIRED"){showLogin("");return}
    if(location.protocol==="file:"){
      DATA=demoRows();
      if(preserveState)reconcileHierarchy();else resetHierarchy();
      populateOfferMenu();populateFilters();setBounds(preserveState);renderColumnsMenu();render();
      setMode("Preview","Local preview data");
      $("dataNotice").textContent="Local preview: deploy with the existing API files to load live Reporting Data.";
      $("dataNotice").classList.remove("hidden");
    }else{
      setMode("Error","Data unavailable");
      $("dataNotice").textContent="Live advertising data could not be loaded. "+error.message;
      $("dataNotice").classList.remove("hidden");
    }
  }finally{$("refreshBtn").classList.remove("spin")}
}
$("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const button=$("loginBtn");button.disabled=true;button.textContent="Checking...";
  $("loginError").textContent="";
  try{
    const response=await fetch(apiPath("/api/auth"),{method:"POST",headers:{"Content-Type":"application/json"},
      credentials:"same-origin",body:JSON.stringify({password:$("dashboardPassword").value})});
    if(!response.ok)throw new Error("Wrong password. Please try again.");
    $("dashboardPassword").value="";hideLogin();await boot();
  }catch(error){$("loginError").textContent=error.message}
  finally{button.disabled=false;button.textContent="Unlock dashboard"}
});
$("logoutBtn").addEventListener("click",async()=>{
  await fetch(apiPath("/api/logout"),{method:"POST",credentials:"same-origin"}).catch(()=>{});
  showLogin("Signed out.");
});
$("refreshBtn").addEventListener("click",()=>boot(true));
$("offerTrigger").addEventListener("click",event=>{
  event.stopPropagation();
  $("offerMenu").classList.toggle("hidden");
  $("offerTrigger").setAttribute("aria-expanded",String(!$("offerMenu").classList.contains("hidden")));
});
$("offerMenu").addEventListener("click",event=>event.stopPropagation());
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
  state.level=tab.dataset.level;
  state.page=1;renderColumnsMenu();render();
}));
$("platformFilter").addEventListener("change",()=>{state.platform=$("platformFilter").value;resetHierarchy();populateFilters();render()});
$("funnelFilter").addEventListener("change",()=>{state.funnel=$("funnelFilter").value;resetHierarchy();render()});
$("dpTrigger").addEventListener("click",dpOpen);
$("dpCancel").addEventListener("click",dpClose);
$("dpUpdate").addEventListener("click",()=>{
  if(!dp.selStart||!dp.selEnd)return;
  state.range=dp.preset;state.start=new Date(dp.selStart);state.end=new Date(dp.selEnd);
  state.page=1;dpUpdateTrigger();dpClose();render();
});
$("dpOverlay").addEventListener("click",event=>{if(event.target===$("dpOverlay"))dpClose()});
let searchTimer=null;
$("searchInput").addEventListener("input",()=>{
  clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=$("searchInput").value.trim();state.page=1;render()},140);
});
$("columnsBtn").addEventListener("click",event=>{
  event.stopPropagation();$("columnsMenu").classList.toggle("hidden");
  $("columnsBtn").setAttribute("aria-expanded",String(!$("columnsMenu").classList.contains("hidden")));
});
$("columnsMenu").addEventListener("click",event=>event.stopPropagation());
document.addEventListener("click",()=>{
  $("columnsMenu").classList.add("hidden");$("columnsBtn").setAttribute("aria-expanded","false");
  $("offerMenu").classList.add("hidden");$("offerTrigger").setAttribute("aria-expanded","false");
});
$("pageSize").addEventListener("change",()=>{state.pageSize=Number($("pageSize").value);state.page=1;renderTable()});
$("prevPage").addEventListener("click",()=>{if(state.page>1){state.page--;renderTable()}});
$("nextPage").addEventListener("click",()=>{state.page++;renderTable()});
let resizeTimer=null;
window.addEventListener("resize",()=>{
  if(!state.autoFit)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(renderTable,120);
});
boot();
</script>
